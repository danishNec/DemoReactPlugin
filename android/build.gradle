buildscript {
    ext {
        // 36.0.0's package.xml uses a newer SDK repository schema (v4) that this AGP's
        // native-build (CMake/cxx) config parser can't read yet — CXX5304 "This version only
        // understands SDK XML versions up to 3 but an SDK XML file of version 4 was
        // encountered." 35.0.0 uses the older, compatible schema and fully supports
        // compiling against compileSdk 36.
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Pinned to the version React Native 0.86.2's own gradle-plugin is built/tested
        // against (see node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml).
        // Left unpinned, Gradle's conflict resolution can pick up a newer AGP from the
        // shared Gradle cache (e.g. 9.3.1 from an unrelated project), which has a native
        // build (CMake/cxx) metadata-parsing regression: "CXX5304 This version only
        // understands SDK XML versions up to 3 but an SDK XML file of version 4 was
        // encountered."
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
